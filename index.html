<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BigBsky is a desktop-first Bluesky reader built as a static app."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://public.api.bsky.app" />
    <link rel="dns-prefetch" href="https://public.api.bsky.app" />
    <title>BigBsky</title>
    <!--
      Boot styles are inlined here on purpose: the app stylesheet (src/styles.css)
      is bundled into the JS entry, so it only loads once JS runs. Without this,
      a slow/failed bundle or disabled JS would render as a blank white page.
      Keep this small and self-contained. Palette mirrors :root in src/styles.css
      (the app is dark-only: color-scheme: dark).
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b111c;
        color: #f9fafb;
      }
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #aebdcc;
      }
      .app-boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 3px solid #2c3a4f;
        border-top-color: #0560ff;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation-duration: 2.4s;
        }
      }
      .app-boot-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #f9fafb;
      }
      .app-boot-text {
        margin: 0;
        max-width: 30rem;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .app-boot-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .app-boot-btn {
        appearance: none;
        border: 1px solid #3b4c65;
        border-radius: 999px;
        background: #0560ff;
        color: #f9fafb;
        font: inherit;
        font-weight: 600;
        padding: 8px 18px;
        cursor: pointer;
        text-decoration: none;
      }
      .app-boot-btn:hover {
        background: #034dcc;
      }
      .app-boot-btn.secondary {
        background: #1d293b;
      }
      .app-boot-btn.secondary:hover {
        background: #2c3a4f;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; the failure detector below swaps it to an
           error state if the app never mounts (e.g. the bundle fails to load). -->
      <div id="app-loading" class="app-boot" role="status" aria-live="polite">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p class="app-boot-text">Loading BigBsky…</p>
      </div>
    </div>
    <noscript>
      <!-- Hide the spinner (which would otherwise spin forever) and show a
           JavaScript-required message when scripting is disabled. -->
      <style>
        #app-loading {
          display: none;
        }
      </style>
      <div class="app-boot">
        <p class="app-boot-title">JavaScript is required</p>
        <p class="app-boot-text">
          BigBsky is a client-side Bluesky reader that runs entirely in your
          browser. Please enable JavaScript to continue.
        </p>
      </div>
    </noscript>
    <!--
      The boot failure detector lives in /boot-error.js (external, defer) so it
      stays allowed under the site's Content-Security-Policy (see public/_headers)
      without a hash or nonce: an inline script or inline onclick handler would be
      blocked once script-src 'self' is enforced, which is exactly the failure it
      is meant to catch. It runs even when the app bundle fails to load, because it
      is a separate static file.
    -->
    <script src="/boot-error.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
